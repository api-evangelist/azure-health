        url: https://azure.microsoft.com/en-us/pricing/details/health-data-services/

  - aid: azure-health:medtech-service
    name: Azure Health Data Services MedTech Service API
    description: >-
      A managed IoMT (Internet of Medical Things) ingestion service that transforms
      device telemetry and health sensor data from disparate proprietary formats into
      FHIR R4-based Observation resources, then persists them in the Azure Health Data
      Services FHIR service. Receives device messages via an Azure Event Hub endpoint,
      applies configurable device and FHIR mapping templates, and supports multiple
      concurrent device types. Enables unified health data access across clinical and
      wearable/monitoring device data streams.
    humanURL: https://learn.microsoft.com/en-us/azure/healthcare-apis/iot/iot-connector-overview
    baseURL: https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.HealthcareApis
    tags:
      - MedTech
      - IoMT
      - Medical Devices
      - Wearables
      - Device Data
      - FHIR Observations
      - Event Hub
