aid: azure-health
name: Microsoft Azure Health Data Services
description: >-
  Microsoft Azure Health Data Services is a cloud-based suite of managed API services
  built on open healthcare standards (FHIR R4, DICOM, HL7) that enables healthcare
  organizations to collect, store, analyze, and exchange protected health information
  (PHI) at scale. The platform includes a FHIR service for structured clinical data
  exchange, a DICOM service for medical imaging workflows, a MedTech service for
  IoMT device data ingestion, and a de-identification service for HIPAA-compliant
  PHI removal from unstructured text. All services run within a HIPAA/HITRUST
  compliance boundary in an Azure workspace and authenticate via Microsoft Entra ID
  OAuth 2.0 bearer tokens.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
