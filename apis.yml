  - aid: azure-health:workspace-management-api
    name: Azure Health Data Services Workspace Management REST API
    description: >-
      Azure Resource Manager (ARM) control-plane REST API for provisioning and managing
      Azure Health Data Services workspaces, FHIR service instances, DICOM service
      instances, MedTech (IoT Connector) instances, private endpoint connections,
      and private link resources. Uses Microsoft Entra ID OAuth 2.0 authentication
      against the management.azure.com endpoint. API version 2023-11-01 is the current
      stable release.
    humanURL: https://learn.microsoft.com/en-us/rest/api/healthcareapis/
    baseURL: https://management.azure.com
    tags:
