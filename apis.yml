apis:
  - aid: azure-health:fhir-service
    name: Azure Health Data Services FHIR Service API
    description: >-
      A managed, FHIR R4-compliant REST API service that enables rapid exchange and
      storage of electronic health records and clinical data using the HL7 FHIR
      standard. Supports SMART on FHIR v1 and v2 for mobile and web client
      authorization, Microsoft Entra ID role-based access control (RBAC), audit
      logging, batch/transaction bundles, and advanced FHIR search. PHI data is
      isolated per FHIR service instance with multi-region failover. The FHIR service
      is the evolved replacement for the legacy Azure API for FHIR (retiring
      September 30, 2026).
    humanURL: https://learn.microsoft.com/en-us/azure/healthcare-apis/fhir/overview
    baseURL: https://{workspace-name}-{fhir-service-name}.fhir.azurehealthcareapis.com
    tags:
      - FHIR
      - FHIR R4
      - Clinical Data
      - HL7
      - SMART on FHIR
      - Electronic Health Records
      - Healthcare Interoperability
    properties:
      - type: Documentation
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/fhir/overview
      - type: REST API Reference
        url: https://learn.microsoft.com/en-us/rest/api/healthcareapis/fhir-services
      - type: OpenAPI
        url: https://github.com/Azure/azure-rest-api-specs/tree/main/specification/healthcareapis
      - type: Authentication
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/authentication-authorization
      - type: GettingStarted
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/fhir/get-started-with-fhir
      - type: SMART on FHIR
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/fhir/smart-on-fhir
      - type: Search Reference
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/fhir/overview-of-search
      - type: ChangeLog
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/release-notes-2024
      - type: Pricing
        url: https://azure.microsoft.com/en-us/pricing/details/health-data-services/

  - aid: azure-health:dicom-service
    name: Azure Health Data Services DICOM Service API
    description: >-
      A managed cloud service implementing DICOMweb Standard APIs (STOW-RS, QIDO-RS,
      WADO-RS) for storing, searching, and retrieving medical imaging data at scale.
      Supports ingestion of thousands of DICOM images per second, extended query tags,
      change feed for ordered audit logs, and the Worklist Service (UPS-RS) for
      unified procedure step workflows. PHI-compliant with Azure Locally Redundant
      Storage (LRS) for automatic data replication. Integrates with the FHIR service
      via DICOMcast to publish imaging metadata as FHIR ImagingStudy resources.
    humanURL: https://learn.microsoft.com/en-us/azure/healthcare-apis/dicom/overview
    baseURL: https://{workspace-name}-{dicom-service-name}.dicom.azurehealthcareapis.com
    tags:
      - DICOM
      - DICOMweb
      - Medical Imaging
      - STOW-RS
      - QIDO-RS
      - WADO-RS
      - Radiology
    properties:
      - type: Documentation
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/dicom/overview
      - type: REST API Reference
        url: https://learn.microsoft.com/en-us/rest/api/healthcareapis/dicom-services
      - type: OpenAPI
        url: https://github.com/Azure/azure-rest-api-specs/tree/main/specification/healthcareapis
      - type: Authentication
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/authentication-authorization
      - type: DICOMweb Standard APIs Guide
        url: https://learn.microsoft.com/en-us/azure/healthcare-apis/dicom/dicomweb-standard-apis-with-dicom-services
      - type: Conformance Statement
